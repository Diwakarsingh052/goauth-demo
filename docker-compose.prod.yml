version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Caddy — Reverse proxy (HTTP only, IP-based deployment)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: challange-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - web
      - api
    networks:
      - app

  # ---------------------------------------------------------------------------
  # MySQL Database
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: challange-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-challange_go}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - app

  # ---------------------------------------------------------------------------
  # REST API Server (internal only — not exposed to the host)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      target: api
    container_name: challange-api
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-challange_go}
      API_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app

  # ---------------------------------------------------------------------------
  # Web Frontend Server (internal only — Caddy proxies to it)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      target: web
    container_name: challange-web
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8080
      WEB_PORT: "8081"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost/auth/google/callback}
    depends_on:
      - api
    networks:
      - app

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  app:
    driver: bridge