
services:
# MySQL Database
  mysql:
    image: mysql:8.0
    container_name: challenge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-challenge_go}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s


# REST API Server
  api:
    build:
      context: .
      target: api
    container_name: challenge-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-challenge_go}
      API_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-secure-secret}
    depends_on:
      mysql:
        condition: service_healthy

# Web Frontend Server
  web:
    build:
      context: .
      target: web
    container_name: challenge-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:8081"
    environment:
      API_BASE_URL: http://api:8080
      WEB_PORT: "8081"
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-session-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8081/auth/google/callback}
    depends_on:
      - api

volumes:
  mysql_data: