{{define "content"}}
<div class="form-container">
    <h1>Main Profile</h1>
    <div class="profile-card">
        <div class="profile-field">
            <span class="profile-label">Full Name</span>
            <span class="profile-value">{{if .User}}{{if .User.FullName}}{{.User.FullName}}{{else}}<em>Not set</em>{{end}}{{end}}</span>
        </div>
        <div class="profile-field">
            <span class="profile-label">Telephone</span>
            <span class="profile-value">{{if .User}}{{if .User.Telephone}}+1 {{.User.Telephone}}{{else}}<em>Not set</em>{{end}}{{end}}</span>
        </div>
        <div class="profile-field">
            <span class="profile-label">Email</span>
            <span class="profile-value">{{if .User}}{{.User.Email}}{{end}}</span>
        </div>
    </div>
    <div class="button-group">
        <a href="/profile/edit" class="btn btn-primary">Edit</a>
        <form method="POST" action="/logout" style="display:inline;">
            <button type="submit" class="btn btn-danger">Logout</button>
        </form>
    </div>
</div>
{{end}}
