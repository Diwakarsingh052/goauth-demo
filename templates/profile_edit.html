{{define "content"}}
<div class="form-container">
    <h1>Enter Profile Information</h1>
    {{if .Error}}
    <div class="alert alert-error">{{.Error}}</div>
    {{end}}
    <form method="POST" action="/profile/edit">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" placeholder="Enter your full name"
                   value="{{if .User}}{{.User.FullName}}{{end}}">
        </div>
        <div class="form-group">
            <label for="telephone">Telephone</label>
            <div class="phone-input-group">
                <span class="phone-prefix">+1</span>
                <input type="tel" id="telephone" name="telephone" placeholder="(555) 123-4567"
                       value="{{if .User}}{{.User.Telephone}}{{end}}" maxlength="14">
            </div>
        </div>
        <script>
        (function() {
            var ph = document.getElementById('telephone');
            if (!ph) return;

            function format(digits) {
                if (digits.length === 0) return '';
                if (digits.length <= 3) return '(' + digits;
                if (digits.length <= 6) return '(' + digits.substring(0,3) + ') ' + digits.substring(3);
                return '(' + digits.substring(0,3) + ') ' + digits.substring(3,6) + '-' + digits.substring(6);
            }

            ph.addEventListener('keydown', function(e) {
                var digits = this.value.replace(/\D/g, '');
                // Allow: backspace, delete, tab, escape, arrows, home, end
                if ([8,9,27,46].indexOf(e.keyCode) !== -1 || (e.keyCode >= 35 && e.keyCode <= 40)) return;
                // Allow Ctrl/Cmd + A/C/V/X
                if ((e.ctrlKey || e.metaKey) && [65,67,86,88].indexOf(e.keyCode) !== -1) return;
                // Block non-digit keys
                var key = e.key;
                if (key.length === 1 && (key < '0' || key > '9')) { e.preventDefault(); return; }
                // Block if already 10 digits
                if (digits.length >= 10 && key >= '0' && key <= '9') { e.preventDefault(); return; }
            });

            ph.addEventListener('input', function() {
                var digits = this.value.replace(/\D/g, '');
                if (digits.length > 10) digits = digits.substring(0, 10);
                this.value = format(digits);
            });
        })();
        </script>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email"
                   value="{{if .User}}{{.User.Email}}{{end}}"
                   {{if .IsGoogle}}disabled{{end}}>
            {{if .IsGoogle}}
            <input type="hidden" name="email" value="{{.User.Email}}">
            <small class="form-hint">Email cannot be changed for Google accounts</small>
            {{end}}
        </div>
        <div class="button-group">
            <button type="submit" class="btn btn-primary">Save &amp; Continue</button>
            <a href="/profile" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{{end}}
